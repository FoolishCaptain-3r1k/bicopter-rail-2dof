[platformio]
; Same acquisition firmware as the validated base. Only the local UI changes.
src_dir = ../dual-usb/src
include_dir = ../dual-usb/include

[env:esp32dev]
platform = espressif32@7.1.3
board = esp32dev
framework = arduino
monitor_speed = 115200
build_flags =
    -Wall
    -Wextra
    -DBNO_I2C_RESTART=0
lib_deps =
    pololu/VL53L0X@1.3.1
