[env:esp32dev]
platform = espressif32@7.1.3
board = esp32dev
framework = arduino
monitor_speed = 115200
build_flags =
    -Wall
    -Wextra
    -DBNO_USE_NDOF=0
    -DBNO_DIAG_MODE=1
    -DBNO_ENABLE_WIFI=0
    -DBNO_I2C_RESTART=0
lib_deps =
    adafruit/Adafruit BNO055@1.6.4

[env:esp32dev_wifi]
extends = env:esp32dev
build_flags =
    -Wall
    -Wextra
    -DBNO_USE_NDOF=0
    -DBNO_DIAG_MODE=0
    -DBNO_ENABLE_WIFI=1
    -DBNO_I2C_RESTART=0
