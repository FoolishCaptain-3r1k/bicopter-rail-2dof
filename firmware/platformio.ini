[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
build_flags =
    -Wall
    -Wextra
lib_deps =
    adafruit/Adafruit BNO055
    pololu/VL53L0X
    pololu/VL53L1X

[env:native]
platform = native
test_framework = custom
test_build_src = no
build_flags =
    -std=c++17
    -Wall
    -Wextra
