[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "bicopter-host"
version = "0.1.0"
description = "Host telemetry and analysis package for the 2-DOF Bicopter Rail testbed."
requires-python = ">=3.11"
dependencies = [
    "pyserial>=3.5",
    "numpy>=1.26",
    "matplotlib>=3.8",
    "pytest>=8.0",
    "trimesh>=4.0",
    "manifold3d>=2.5",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests", "../hardware/tests"]
pythonpath = ["src", ".."]
